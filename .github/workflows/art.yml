name: Render Chhotu

on:
  push:
    branches: [main, art-dev]
    paths: ["art/chhotu.py", "art/mode.txt", ".github/workflows/art.yml"]
  workflow_dispatch:

concurrency:
  group: render-art-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      clips: ${{ steps.p.outputs.clips }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          if [ "$(cat art/mode.txt)" = preview ]; then
            echo 'clips=["preview"]' >> "$GITHUB_OUTPUT"
          elif [ "$(cat art/mode.txt)" != full ]; then
            echo "clips=$(tr -d '\n' < art/mode.txt | jq -Rc 'split(",")')" >> "$GITHUB_OUTPUT"
          elif [ "$(cat art/char.txt 2>/dev/null)" = baby ]; then
            echo 'clips=["idle","happy","excited","talk","sad","surprised","sleepy","grumpy","thinking","dance","hop","eat","drive","swing"]' >> "$GITHUB_OUTPUT"
          else
            echo 'clips=["idle","happy","excited","talk","mail","sad","surprised","sleepy","grumpy","thinking","swag","swagidle","swagtalk","dance"]' >> "$GITHUB_OUTPUT"
          fi
  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        clip: ${{ fromJson(needs.plan.outputs.clips) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        timeout-minutes: 12
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxi6 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 libice6 libxxf86vm1 libxfixes3 webp
          curl -fsSL --retry 5 -o b.tar.xz https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz
          mkdir -p "$HOME/blender" && tar -xf b.tar.xz -C "$HOME/blender" --strip-components=1
          rm b.tar.xz
          echo "$HOME/blender" >> "$GITHUB_PATH"
          export PATH="$HOME/blender:$PATH"
          blender --version | head -1
      - name: Render
        run: |
          export CHAR=$(cat art/char.txt 2>/dev/null || echo chhotu)
          blender -b -noaudio -P art/chhotu.py -- "${{ matrix.clip }}" "$PWD/art/out"
          ls art/out | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.clip }}
          path: art/out
          retention-days: 2
  save:
    needs: render
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art/got
      - name: Save
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get install -y -qq webp
          MODE=$(cat art/mode.txt)
          CHAR=$(cat art/char.txt 2>/dev/null || echo chhotu)
          if [ "$MODE" = preview ]; then
            mkdir -p art/preview
            rm -f art/preview/*
            cp art/got/*/*.png art/preview/
          else
            mkdir -p app/src/main/assets/$CHAR
            if [ "$MODE" = full ]; then rm -f app/src/main/assets/$CHAR/*; fi
            for f in art/got/*/*.png; do
              cwebp -quiet -q 84 -alpha_q 90 "$f" -o "app/src/main/assets/$CHAR/$(basename "${f%.png}").webp"
            done
          fi
          rm -rf art/got
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add art/preview app/src/main/assets 2>/dev/null || true
          git commit -m "Render Chhotu art ($MODE)" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          if [ "$GITHUB_REF_NAME" = main ]; then gh workflow run build.yml --ref main; fi
